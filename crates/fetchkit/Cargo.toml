[package]
name = "fetchkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["docs-pdf", "docs-office"]
# Document conversion backends (see knowledge/foundations/fetchers.md)
docs-pdf = ["dep:pdf-inspector"]
docs-office = ["dep:calamine", "dep:zip", "dep:quick-xml"]
docs-cloudflare = []
docs-http = []
docs-all = ["docs-pdf", "docs-office", "docs-cloudflare", "docs-http"]
bot-auth = ["dep:ed25519-dalek", "dep:base64", "dep:sha2", "dep:rand"]
live-tests = []
render-rakers = ["dep:rakers"]

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
tower = { workspace = true }
pdf-inspector = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
libc = { workspace = true }
rakers = { workspace = true, optional = true }

# Optional: bot-auth feature
ed25519-dalek = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
mira-eval = "0.3"
