[package]
name = "fetchkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command line interface for FetchKit web content fetching tool"
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
# Keep CLI docs off so rustdoc doesn't collide with the library's `fetchkit` output.
name = "fetchkit"
path = "src/main.rs"
doc = false

[features]
default = []
bot-auth = ["fetchkit/bot-auth"]
render-rakers = ["fetchkit/render-rakers"]

[dependencies]
fetchkit = { path = "../fetchkit", version = "0.4.1" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
