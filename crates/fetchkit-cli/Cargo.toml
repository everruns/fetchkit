[package]
name = "fetchkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command line interface for Fetchkit web content fetching tool"
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
name = "fetchkit_cli"
path = "src/lib.rs"

[[bin]]
# Keep CLI docs off so rustdoc doesn't collide with the library's `fetchkit` output.
name = "fetchkit"
path = "src/main.rs"
doc = false

[features]
default = []
bot-auth = ["fetchkit/bot-auth"]
render-rakers = ["fetchkit/render-rakers"]
docs-markkit = ["fetchkit/docs-markkit"]
docs-office = ["fetchkit/docs-office"]
docs-cloudflare = ["fetchkit/docs-cloudflare"]
docs-http = ["fetchkit/docs-http"]
docs-all = ["fetchkit/docs-all"]

[dependencies]
fetchkit = { path = "../fetchkit", version = "0.6.0" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
